name = "bondlab"
compatibility_date = "2026-10-22"
workers_dev = false
main = "./worker/index.mjs"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "PUBCHEM_QUOTA"
class_name = "PubChemQuota"

[[migrations]]
tag = "pubchem-quota-v1"
new_sqlite_classes = ["PubChemQuota"]
